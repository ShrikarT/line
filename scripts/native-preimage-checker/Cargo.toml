[package]
name = "line-native-preimage-checker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
midnight-ledger = { version = "=8.1.3", default-features = false, features = ["proof-verifying"] }
midnight-base-crypto = "=1.0.2"
midnight-transient-crypto = "=2.1.1"
midnight-storage = "=2.0.3"
midnight-serialize = "=1.1.1"
midnight-zkir = "=2.1.1"
serde_json = "=1.0.152"
rand = "=0.8.8"
tokio = { version = "=1.53.2", features = ["rt-multi-thread"] }
