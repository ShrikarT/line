<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#111">line — protocol flow</text>

  <!-- Issuer -->
  <rect x="30" y="60" width="170" height="110" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">1 · Finance Admin</text>
  <text x="115" y="110" text-anchor="middle" font-size="12" fill="#333">(issuer)</text>
  <text x="115" y="132" text-anchor="middle" font-size="12" fill="#333">issues agent budget</text>
  <text x="115" y="150" text-anchor="middle" font-size="12" fill="#333">funds reserve pool</text>

  <!-- Agent -->
  <rect x="345" y="60" width="170" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">2 · Agent</text>
  <text x="430" y="112" text-anchor="middle" font-size="12" fill="#333">proves B + A ≤ L in-circuit</text>
  <text x="430" y="130" text-anchor="middle" font-size="12" fill="#333">(simulated via compact-runtime)</text>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#333">issues note D</text>

  <!-- Merchant -->
  <rect x="660" y="60" width="170" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="745" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">3 · Merchant</text>
  <text x="745" y="112" text-anchor="middle" font-size="12" fill="#333">posts quote Q</text>
  <text x="745" y="130" text-anchor="middle" font-size="12" fill="#333">redeems note D once</text>
  <text x="745" y="148" text-anchor="middle" font-size="12" fill="#333">via N_redeem nullifier</text>

  <!-- Arrows: issuer -> agent -> merchant -->
  <line x1="200" y1="115" x2="338" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="106" text-anchor="middle" font-size="11" fill="#555">openLine(L)</text>
  <line x1="515" y1="115" x2="653" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="584" y="106" text-anchor="middle" font-size="11" fill="#555">draw note D</text>

  <!-- Reserve pool -->
  <rect x="185" y="230" width="490" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Reserve pool (on-ledger, public)</text>
  <text x="430" y="282" text-anchor="middle" font-size="12" fill="#333">totalReserve · encumberedReserve · redeemedReserve</text>
  <text x="430" y="302" text-anchor="middle" font-size="12" fill="#333">draw encumbers A · redeemDraw shifts encumbered → redeemed</text>
  <text x="430" y="322" text-anchor="middle" font-size="12" fill="#333">issuer can withdraw only the unencumbered remainder</text>
  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#777">amounts are public escrow accounting — not hidden</text>

  <!-- Vertical arrows to reserve -->
  <line x1="115" y1="170" x2="260" y2="226" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="205" font-size="11" fill="#7c3aed">fundReserve</text>
  <line x1="430" y1="170" x2="430" y2="226" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="438" y="205" font-size="11" fill="#7c3aed">encumber A</text>
  <line x1="745" y1="170" x2="600" y2="226" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="205" font-size="11" fill="#7c3aed">redeem D</text>

  <!-- Public explorer -->
  <rect x="30" y="375" width="800" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="397" text-anchor="middle" font-size="12" fill="#475569">4 · Public explorer sees: reserve totals, note amounts, commitments (I, C, Q, D), nullifiers, actionClock — never secrets, salts, or identity preimages</text>
</svg>
