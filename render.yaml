services:
  - type: web
    name: line-midnight
    runtime: node
    repo: https://github.com/ShrikarT/line
    branch: main
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: |
      set -eu
      npm ci --include=dev
      npm run organization:install-release
      npm run build:deploy
    startCommand: >-
      env LINE_PUBLIC_ORIGIN="$RENDER_EXTERNAL_URL"
      node --env-file-if-exists=/etc/secrets/line.env
      --experimental-strip-types server/organization-server.mjs
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: NODE_ENV
        value: production
      - key: LINE_ORGANIZATION_MODE
        value: wallet-only
      - key: MIDNIGHT_BLOCKFROST_PROJECT_ID
        sync: false
