name: Submission deck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/submission-pages.yml
      - artifacts/wave2/line-wave2.html
      - artifacts/wave2/OFL.txt

permissions:
  contents: read

concurrency:
  group: submission-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Package the standalone deck only
        run: |
          mkdir -p _site
          cp artifacts/wave2/line-wave2.html _site/index.html
          cp artifacts/wave2/OFL.txt _site/OFL.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish deck
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
