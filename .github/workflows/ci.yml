name: ci

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  native-worker-ownership:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the worker guardian
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --manifest-path scripts/private-worker-guardian/Cargo.toml --target-dir .compact-keys/worker-guardian-target
      - name: Verify actual process ownership and parent loss
        run: node --test tests/worker-guardian.test.mjs

  windows-checkpoint-acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check private directory ACLs without module discovery
        run: node --experimental-strip-types --test --test-name-pattern="Windows checkpoint" server/checkout-durability.test.ts

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apache-2.0 LICENSE is the full text
        run: |
          grep -q "Apache License" LICENSE
          grep -q "http://www.apache.org/licenses/" LICENSE
          test "$(wc -c < LICENSE)" -ge 10000

      - name: Install project-pinned Compact toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install-compact.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Compact compiler versions
        run: |
          node scripts/compile-compact.mjs --version
          node scripts/compile-compact.mjs --language-version
          node scripts/compile-compact.mjs --runtime-version
          node scripts/compile-compact.mjs --ledger-version

      - name: Compile Compact contract
        run: npm run compact:compile

      - name: Check for generated artifact drift
        run: git diff --exit-code contracts/managed/

      - name: Compiler numeric-range regression probes
        run: npm run compact:range:check

      - name: Compact simulator tests
        run: npm run compact:test

      - name: TypeScript reference + encoding + demo + MCP tests
        run: npm test

      - name: Compiled independent-key opening experiment
        run: npm run custody:spike

      - name: Compiled private-book population experiment
        run: npm run pool:spike

      - name: Compiled signed-role approval controls
        run: npm run signed:spike

      - name: Compiled private-finance signed-role experiment
        run: npm run privacy:spike

      - name: Compiled private merchant-membership experiment
        run: npm run merchant:spike

      - name: Reachable refund public transcript comparison
        run: npm run merchant:history

      - name: Compiled private enrollment and duplicate-generation controls
        run: npm run enrollment:spike

      - name: Private supplier offers and financial binding controls
        run: npm run offer:spike

      - name: Durable agent approvals in freshly compiled Compact
        run: npm run custody:compact
      - name: Durable agent approvals with private supplier offers
        run: npm run custody:offer:compact

      - name: Recoverable private financial openings and candidates
        run: npm run finance:compact

      - name: Owner approval services and two-merchant Compact integration
        run: npm run owner:service:compact

      - name: Whole coordinator recovery through owner approval services
        run: npm run owner:coordinator:compact

      - name: Decode source-bound public privacy pairs and check wire-size findings
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo build --locked --manifest-path scripts/native-public-components/Cargo.toml --target-dir .compact-keys/public-reader-target
          node scripts/private-offer-wire-review.mjs tests/fixtures/private-offer-public-pairs .compact-keys/public-reader-target/debug/line-native-public-components

      - name: Fail-closed network receipt metadata checks
        run: npm run network:receipts:test

      - name: Typecheck
        run: npm run typecheck

      - name: Audit fixture keys in production paths
        run: npm run check:keys

      - name: Negative audit test for fixture keys
        run: node scripts/check-no-fixture-keys.test.mjs

      - name: Audit hardcoded credentials and secret patterns
        run: npm run check:secrets

      - name: Frontend build
        run: npm run build

      - name: Install browser for role and recovery verification
        run: npx playwright install --with-deps chromium

      - name: Browser checkout, custody and recovery tests
        run: npm run test:e2e
