services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      LINE_PUBLIC_ORIGIN: ${LINE_PUBLIC_ORIGIN:?Set the exact public origin}
      MIDNIGHT_SUPPLIER_MNEMONIC: ${MIDNIGHT_SUPPLIER_MNEMONIC:?Set a dedicated funded supplier seed}
      MIDNIGHT_STORAGE_PASSWORD: ${MIDNIGHT_STORAGE_PASSWORD:?Set the persistent storage password}
      MIDNIGHT_BLOCKFROST_PROJECT_ID: ${MIDNIGHT_BLOCKFROST_PROJECT_ID:?Set the Preprod provider credential}
      MIDNIGHT_PROOF_SERVER_URI: http://proof-server:6300
    volumes:
      - supplier-data:/data/line-supplier
    depends_on:
      - proof-server
    restart: unless-stopped
    stop_grace_period: 5m
  proof-server:
    image: midnightntwrk/proof-server:8.1.3
    environment:
      PORT: "6300"
    restart: unless-stopped
volumes:
  supplier-data:
